<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis 15 Ernes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Prata&family=Open+Sans:wght@300;600&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f4;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            color: #333;
            font-family: 'Open Sans', sans-serif;
            overflow: hidden;
            position: relative;
        }

        .welcome-card {
            position: relative;
            z-index: 1;
            background: #ffffff;
            padding: 45px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 85%;
            max-width: 400px;
            border: 1px solid #e0e0e0;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 65px;
            margin: 0 0 10px 0;
            color: #2c4a3e;
        }

        p {
            font-family: 'Prata', serif;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 13px;
            margin-bottom: 35px;
            color: #555;
        }

        .btn-entrar {
            background: #2c4a3e !important;
            color: #fff !important;
            border: none !important;
            padding: 14px 40px !important;
            border-radius: 50px !important;
            font-family: 'Open Sans', sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 13px !important;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-entrar:hover {
            background: #1b2f27 !important;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <h1>Mis 15 Ernes</h1>
        <p>Quiero que seas parte de esta noche tan importante para mí</p>
        
        <button class="btn-entrar" onclick="location.href='invitacion.html'">
            Ingresar
        </button>
    </div>

</body>
</html>
